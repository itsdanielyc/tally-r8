- navigation "Sections":
  - paragraph: Tally
  - list:
    - listitem:
      - button "Transactions"
    - listitem:
      - button "Import"
    - listitem:
      - button "Categories"
    - listitem:
      - button "Settings"
- main:
  - region "Transactions":
    - heading "Transactions" [level=1]
    - paragraph: 3 transactions
    - form "New transaction":
      - group:
        - text: Date
        - textbox "Date": /\d+-\d+-\d+/
        - text: Kind
        - radiogroup "Kind":
          - radio "Spending" [checked]
          - text: Spending
          - radio "Income"
          - text: Income
        - text: Amount
        - textbox "Amount":
          - /placeholder: "0.00"
        - text: Payee
        - textbox "Payee"
        - text: Category
        - combobox "Category":
          - option "Uncategorised" [selected]
        - text: Note
        - textbox "Note"
        - button "Add"
    - table "Transactions":
      - rowgroup:
        - row "Date Payee Category Note Amount (USD) Actions":
          - columnheader "Date"
          - columnheader "Payee"
          - columnheader "Category"
          - columnheader "Note"
          - columnheader "Amount (USD)"
          - columnheader "Actions"
      - rowgroup:
        - row /\d+-\d+-\d+ Corner shop Uncategorised milk -\d+\.\d+ Edit Delete/:
          - cell /\d+-\d+-\d+/
          - cell "Corner shop"
          - cell "Uncategorised"
          - cell "milk"
          - cell /-\d+\.\d+/
          - cell "Edit Delete":
            - button "Edit"
            - button "Delete"
        - row /\d+-\d+-\d+ Employer Uncategorised November \+\d+,\d+\.\d+ Edit Delete/:
          - cell /\d+-\d+-\d+/
          - cell "Employer"
          - cell "Uncategorised"
          - cell "November"
          - cell /\+\d+,\d+\.\d+/
          - cell "Edit Delete":
            - button "Edit"
            - button "Delete"
        - row /\d+-\d+-\d+ Electricity Uncategorised -\d+\.\d+ Edit Delete/:
          - cell /\d+-\d+-\d+/
          - cell "Electricity"
          - cell "Uncategorised"
          - cell
          - cell /-\d+\.\d+/
          - cell "Edit Delete":
            - button "Edit"
            - button "Delete"
- contentinfo:
  - text: "Ledger: memory backend:"
  - strong: mock